name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Cadence-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the APK, signed with the Cadence key
        id: build
        env:
          CADENCE_KEYSTORE_B64: ${{ secrets.CADENCE_KEYSTORE_B64 }}
          CADENCE_KEYSTORE_PASSWORD: ${{ secrets.CADENCE_KEYSTORE_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "versionName = \"$version\"" app/build.gradle.kts || { echo "tag and versionName differ"; exit 1; }
          if [ -z "$CADENCE_KEYSTORE_B64" ]; then
            echo "::notice::No signing key on this repository: publish the APK from the laptop (see CLAUDE.md)."
            exit 0
          fi
          echo "$CADENCE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cadence.jks"
          export CADENCE_KEYSTORE="$RUNNER_TEMP/cadence.jks"
          ./gradlew --no-daemon assembleRelease
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Cadence-$version-android.apk"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: steps.build.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed -n "/^## \[${GITHUB_REF_NAME#v}\]/,/^## \[/p" CHANGELOG.md | sed '1d;/^## \[/d' > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.apk --title "Cadence ${GITHUB_REF_NAME#v}" --notes-file notes.md
